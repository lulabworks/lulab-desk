<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta id="app-viewport" name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      ;(() => {
        const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent)
          || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches
          || navigator.standalone === true

        if (!isIOS || !isStandalone) return

        document.documentElement.classList.add('ios-standalone')
        document.getElementById('app-viewport')?.setAttribute(
          'content',
          'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover'
        )
      })()
    </script>
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="LuLab Desk — il gestionale quotidiano del laboratorio LuLab" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LuLab Desk" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="64x64" href="%BASE_URL%icons/icon-64x64-v2.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%icons/favicon-32x32-v2.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%icons/favicon-16x16-v2.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%icons/apple-touch-icon-v2.png" />
    <title>LuLab Desk</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      ;(() => {
        const route = new URLSearchParams(window.location.search).get('__spa')
        if (route && route.startsWith('/lulab-desk/')) {
          window.history.replaceState(null, '', route)
        }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
